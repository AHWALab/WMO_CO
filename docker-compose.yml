# ============================================================================
# EF5 (Comores, 30 m), lanceur Docker Compose multiplateforme
# ============================================================================
# Fonctionne sous Linux, Windows et macOS (Docker Desktop).
# Compose résout les montages relatifs sur tous les systèmes : ce seul fichier
# pilote donc EF5 à partir des dossiers de l'espace de travail.
#   ./data   -> /data    (entrées du modèle : basic, parameters, pet, states, precip)
#   ./output -> /output  (résultats EF5)
#   ./conf   -> /conf    (fichier de contrôle EF5, en lecture seule)
#
# Utilisation, sur tous les systèmes :
#   docker compose run --rm ef5                         # exécute conf/control_30m.txt
#   docker compose run --rm ef5 /bin/sh                 # terminal interactif
#   docker compose run --rm -e OMP_NUM_THREADS=8 ef5    # forcer le nombre de fils
#   docker compose build                                # construire l'image depuis les sources
#   docker compose run --rm ef5 /ef5/bin/ef5 /conf/mon_controle.txt
#
# Lanceurs recommandés, plus simples :
#   ./run_ef5.sh        # Linux, macOS, WSL
#   run_ef5.cmd         # Windows CMD
# ============================================================================

services:
  ef5:
    image: ef5-container:latest
    # Facultatif : reconstruire depuis les sources avec  docker compose build
    build:
      context: ./docker
      dockerfile: Dockerfile

    container_name: ef5-comoros
    restart: "no"

    # Dossiers auxquels le conteneur EF5 accède
    volumes:
      - ./data:/data:rw
      - ./output:/output:rw
      - ./conf:/conf:ro

    # Facultatif sous Linux : exécuter avec le compte de l'utilisateur plutôt
    # qu'en root (exporter d'abord UID et GID). À laisser commenté sous
    # Windows et macOS.
    # user: "${UID:-0}:${GID:-0}"

    environment:
      - OMP_PROC_BIND=true
      - OMP_PLACES=cores

    shm_size: "32g"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

    working_dir: /
    command: ["/ef5/bin/ef5", "/conf/control_30m.txt"]
